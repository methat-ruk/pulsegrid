extends:
  - recommended

apis:
  operational:
    root: apps/api/api/openapi/operational.yaml
  telemetry:
    root: apps/api/api/asyncapi/telemetry.yaml
    rules:
      # The local broker is intentionally anonymous and loopback-only in this
      # MVP; production authentication/TLS/ACLs are a later boundary.
      security-defined: off

rules:
  # PulseGrid has no selected repository or API publication license yet.
  # Re-enable this rule when a license or publication contract is adopted.
  info-license: off
