name: Repository quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  NUXT_TELEMETRY_DISABLED: '1'

concurrency:
  group: fnd-003-quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repository-policy:
    name: repository-policy
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Enable pnpm
        run: corepack enable
      - name: Check pnpm version
        run: test "$(corepack pnpm --version)" = "12.3.4"
      - name: Resolve pnpm store
        id: pnpm-store
        shell: bash
        run: echo "path=$(corepack pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Restore pnpm store
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-node-${{ hashFiles('.node-version') }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ hashFiles('.node-version') }}-pnpm-
      - name: Install repository tooling
        run: corepack pnpm install --frozen-lockfile --ignore-scripts --filter pulsegrid
      - name: Validate repository policy
        run: node scripts/check-repository-policy.mjs

  api-static:
    name: api-static
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: .go-version
          cache: true
          cache-dependency-path: |
            apps/api/go.sum
            package.json
      - name: Check Go formatting
        run: node scripts/go-format.mjs
      - name: Run Go modernization checks
        working-directory: apps/api
        env:
          GOFLAGS: -tags=integration
        run: go run golang.org/x/tools/go/analysis/passes/modernize/cmd/modernize@v0.48.0 -errorsastype -rangeint -waitgroupgo ./...
      - name: Run Staticcheck
        working-directory: apps/api
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.0 -tags integration ./...
      - name: Verify Go modules
        run: go -C apps/api mod verify
      - name: Verify GraphQL generated files
        run: go -C apps/api generate ./graph && git diff --exit-code -- apps/api/graph/generated.go apps/api/graph/model/models_gen.go apps/api/graph/device.resolvers.go
      - name: Run Go vet
        run: go -C apps/api vet ./...

  api-test:
    name: api-test
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: .go-version
          cache: true
          cache-dependency-path: apps/api/go.sum
      - name: Run Go tests
        env:
          PULSEGRID_ENV: test
        run: go -C apps/api test ./...

  api-race:
    name: api-race
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: .go-version
          cache: true
          cache-dependency-path: apps/api/go.sum
      - name: Run Go race tests
        env:
          PULSEGRID_ENV: test
        run: go -C apps/api test -race ./...

  api-db-integration:
    name: api-db-integration
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:18.6@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
        env:
          POSTGRES_USER: pulsegrid
          POSTGRES_PASSWORD: pulsegrid-ci
          POSTGRES_DB: pulsegrid_test
        ports:
          - 15432:5432
        options: >-
          --health-cmd "pg_isready -U pulsegrid -d pulsegrid_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: .go-version
          cache: true
          cache-dependency-path: apps/api/go.sum
      - name: Apply migrations
        env:
          PULSEGRID_ENV: test
          PULSEGRID_DATABASE_URL: postgres://pulsegrid:pulsegrid-ci@127.0.0.1:15432/pulsegrid_test?sslmode=disable
        run: go -C apps/api run ./cmd/db migrate up
      - name: Verify migration idempotency
        env:
          PULSEGRID_ENV: test
          PULSEGRID_DATABASE_URL: postgres://pulsegrid:pulsegrid-ci@127.0.0.1:15432/pulsegrid_test?sslmode=disable
        run: go -C apps/api run ./cmd/db migrate up
      - name: Verify disposable migration recovery
        env:
          PULSEGRID_ENV: test
          PULSEGRID_DATABASE_URL: postgres://pulsegrid:pulsegrid-ci@127.0.0.1:15432/pulsegrid_test?sslmode=disable
        run: go -C apps/api run ./cmd/db migrate down
      - name: Reapply migrations after recovery
        env:
          PULSEGRID_ENV: test
          PULSEGRID_DATABASE_URL: postgres://pulsegrid:pulsegrid-ci@127.0.0.1:15432/pulsegrid_test?sslmode=disable
        run: go -C apps/api run ./cmd/db migrate up
      - name: Run PostgreSQL integration tests
        env:
          PULSEGRID_ENV: test
          PULSEGRID_IDENTITY_MODE: development
          PULSEGRID_DATABASE_URL: postgres://pulsegrid:pulsegrid-ci@127.0.0.1:15432/pulsegrid_test?sslmode=disable
        run: go -C apps/api test -count=1 -tags integration ./...

  api-vulnerabilities:
    name: api-vulnerabilities
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: .go-version
          cache: true
          cache-dependency-path: apps/api/go.sum
      - name: Install pinned govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
      - name: Add Go tools to PATH
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Run reachable vulnerability scan
        working-directory: apps/api
        run: govulncheck ./...

  web-lint:
    name: web-lint
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Enable pnpm
        run: corepack enable
      - name: Check pnpm version
        run: test "$(corepack pnpm --version)" = "12.3.4"
      - name: Resolve pnpm store
        id: pnpm-store
        shell: bash
        run: echo "path=$(corepack pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Restore pnpm store
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-node-${{ hashFiles('.node-version') }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ hashFiles('.node-version') }}-pnpm-
      - name: Install workspace dependencies
        run: corepack pnpm install --frozen-lockfile
      - name: Prepare Nuxt workspace
        run: NUXT_TELEMETRY_DISABLED=1 corepack pnpm --filter @pulsegrid/web-console exec nuxt prepare
      - name: Run frontend lint
        run: corepack pnpm run web:lint

  web-typecheck:
    name: web-typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Enable pnpm
        run: corepack enable
      - name: Check pnpm version
        run: test "$(corepack pnpm --version)" = "12.3.4"
      - name: Resolve pnpm store
        id: pnpm-store
        shell: bash
        run: echo "path=$(corepack pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Restore pnpm store
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-node-${{ hashFiles('.node-version') }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ hashFiles('.node-version') }}-pnpm-
      - name: Install workspace dependencies
        run: corepack pnpm install --frozen-lockfile
      - name: Run frontend typecheck
        run: corepack pnpm run web:typecheck
      - name: Run browser fixture typecheck
        run: corepack pnpm run browser:typecheck

  web-test:
    name: web-test
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Enable pnpm
        run: corepack enable
      - name: Check pnpm version
        run: test "$(corepack pnpm --version)" = "12.3.4"
      - name: Resolve pnpm store
        id: pnpm-store
        shell: bash
        run: echo "path=$(corepack pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Restore pnpm store
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-node-${{ hashFiles('.node-version') }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ hashFiles('.node-version') }}-pnpm-
      - name: Install workspace dependencies
        run: corepack pnpm install --frozen-lockfile
      - name: Prepare Nuxt workspace
        run: NUXT_TELEMETRY_DISABLED=1 corepack pnpm --filter @pulsegrid/web-console exec nuxt prepare
      - name: Run frontend tests
        env:
          NUXT_APP_ENV: test
        run: corepack pnpm run web:test

  web-build:
    name: web-build
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Enable pnpm
        run: corepack enable
      - name: Check pnpm version
        run: test "$(corepack pnpm --version)" = "12.3.4"
      - name: Resolve pnpm store
        id: pnpm-store
        shell: bash
        run: echo "path=$(corepack pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Restore pnpm store
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-node-${{ hashFiles('.node-version') }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ hashFiles('.node-version') }}-pnpm-
      - name: Install workspace dependencies
        run: corepack pnpm install --frozen-lockfile
      - name: Build frontend in production mode
        env:
          NUXT_APP_ENV: production
        run: corepack pnpm run web:build

  node-dependency-audit:
    name: node-dependency-audit
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Enable pnpm
        run: corepack enable
      - name: Check pnpm version
        run: test "$(corepack pnpm --version)" = "12.3.4"
      - name: Resolve pnpm store
        id: pnpm-store
        shell: bash
        run: echo "path=$(corepack pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Restore pnpm store
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-node-${{ hashFiles('.node-version') }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ hashFiles('.node-version') }}-pnpm-
      - name: Install workspace dependencies
        run: corepack pnpm install --frozen-lockfile
      - name: Audit production dependencies
        run: corepack pnpm run node:audit

  openapi-contract:
    name: openapi-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Enable pnpm
        run: corepack enable
      - name: Check pnpm version
        run: test "$(corepack pnpm --version)" = "12.3.4"
      - name: Resolve pnpm store
        id: pnpm-store
        shell: bash
        run: echo "path=$(corepack pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Restore pnpm store
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-node-${{ hashFiles('.node-version') }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ hashFiles('.node-version') }}-pnpm-
      - name: Install workspace dependencies
        run: corepack pnpm install --frozen-lockfile
      - name: Validate and render OpenAPI
        run: corepack pnpm run openapi
      - name: Upload OpenAPI review artifacts
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: openapi-review-${{ github.sha }}
          path: .openapi/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 3

  browser-smoke:
    name: browser-smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: .go-version
          cache: true
          cache-dependency-path: apps/api/go.sum
      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Enable pnpm
        run: corepack enable
      - name: Check pnpm version
        run: test "$(corepack pnpm --version)" = "12.3.4"
      - name: Resolve pnpm store
        id: pnpm-store
        shell: bash
        run: echo "path=$(corepack pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Restore pnpm store
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-node-${{ hashFiles('.node-version') }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ hashFiles('.node-version') }}-pnpm-
      - name: Install workspace dependencies
        run: corepack pnpm install --frozen-lockfile
      - name: Install Chromium headless shell and Linux dependencies
        run: corepack pnpm exec playwright install --with-deps --only-shell chromium
      - name: Run browser smoke
        env:
          NUXT_APP_ENV: test
        run: corepack pnpm run test:browser
      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-diagnostics-${{ github.sha }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: warn
          retention-days: 3
