# MVP-004 local/test transport fixture. Host exposure is constrained by the
# Compose port mappings to 127.0.0.1; this listener carries no application
# authorization or production identity.
listener 1883
socket_domain ipv4
protocol mqtt
allow_anonymous true

# Telemetry is ephemeral and emitted to the container log stream only.
persistence false
log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages false

# Bound broker work for this local fixture. The simulator payload is below 1 KiB.
message_size_limit 16384
